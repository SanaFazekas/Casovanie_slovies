<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Časovanie slovies</title>
    <style>
        :root {
            --primary: #3A7BD5;
            --secondary: #00D2FF;
            --bg-color: #F0F4F8;
            --panel-bg: #FFFFFF;
            --text-color: #2C3E50;
            --success: #2ECC71;
            --danger: #E74C3C;
            --border: #DCDFE6;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 320px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            flex-shrink: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 1.1rem;
            color: var(--primary);
            margin: 0 0 4px 0;
            border-bottom: 2px solid var(--secondary);
            padding-bottom: 4px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        select, input[type="checkbox"] {
            cursor: pointer;
        }

        select {
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
        }

        .btn-sidebar {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 10px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-sidebar:hover { opacity: 0.9; }
        .btn-danger { background: var(--danger); }
        .btn-success { background: var(--success); }

        /* Stats Table Styles */
        .stats-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 5px;
        }

        .table-wrapper {
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            text-align: center;
        }

        th, td {
            padding: 5px 6px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: var(--primary);
            color: white;
            position: sticky;
            top: 0;
        }

        tr:nth-child(even) { background-color: #F8FAFC; }

        /* Main Content Styles */
        .main-content {
            flex-grow: 1;
            padding: 20px 30px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: flex-start;
            align-items: center;
            overflow-y: auto;
        }

        .app-title {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--primary);
            margin: 0 0 15px 0;
            text-align: center;
        }

        /* Keyboard Styles */
        .keyboard-container {
            background: var(--panel-bg);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            margin-bottom: 15px;
            text-align: center;
            width: 100%;
            max-width: 650px;
        }

        .keys-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px;
        }

        .key-btn {
            background: #EAECEE;
            border: 1px solid #BDC3C7;
            border-radius: 4px;
            padding: 5px 9px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        .key-btn:hover {
            background: var(--primary);
            color: white;
        }

        /* Task Box Card */
        .task-card {
            background: var(--panel-bg);
            border-radius: 10px;
            padding: 20px 25px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            color: #7F8C8D;
            font-weight: 600;
        }

        .task-question {
            font-size: 1.2rem;
            line-height: 1.4;
            color: var(--text-color);
        }

        .task-question strong {
            color: var(--primary);
        }

        .words-display-box {
            background: #F4F6F7;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            color: var(--primary);
            letter-spacing: 0.5px;
        }

        .input-field {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 6px;
            font-size: 1.05rem;
            outline: none;
        }

        .input-field:focus { border-color: var(--primary); }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .option-btn {
            padding: 10px 12px;
            background: #F4F6F7;
            border: 1.5px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .option-btn:hover {
            background: #EBF5FB;
            border-color: var(--primary);
        }

        .option-btn.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        /* Results Overview Screen */
        .results-container {
            width: 100%;
            max-width: 750px;
            background: white;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid var(--border);
        }

        .result-item {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.95rem;
        }

        .result-item:last-child { border-bottom: none; }
        .result-correct { background-color: #E8F8F5; border-left: 4px solid var(--success); }
        .result-incorrect { background-color: #FDEDEC; border-left: 4px solid var(--danger); }
    </style>
</head>
<body>

    <!-- LEFT SIDEBAR -->
    <div class="sidebar">
        <h2>⚙️ Nastavenia</h2>

        <div class="form-group">
            <label for="level-select">Úroveň (Blooma):</label>
            <select id="level-select" onchange="resetAndStart()">
                <option value="1">1. Zapamätanie (Určovanie vzorov)</option>
                <option value="2" selected>2. Aplikácia (Časovanie v osobách)</option>
                <option value="3">3. Analýza (Kukučie vajce)</option>
                <option value="4">4. Hodnotenie (Oprava chýb)</option>
            </select>
        </div>

        <!-- BE/KIKAPCSOLÁSI GOMB (VÁLASZTÁSI LEHETŐSÉGEK HIDE/SHOW) -->
        <div class="checkbox-group">
            <input type="checkbox" id="options-toggle" checked onchange="resetAndStart()">
            <label for="options-toggle">Možnosti na výber (klikateľné)</label>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="exceptions-toggle" checked onchange="resetAndStart()">
            <label for="exceptions-toggle">Zahrnúť výnimky</label>
        </div>

        <div class="form-group" style="margin-top: 5px;">
            <label for="count-select">Počet príkladov:</label>
            <select id="count-select" onchange="resetAndStart()">
                <option value="7">7 príkladov</option>
                <option value="12" selected>12 príkladov</option>
                <option value="16">16 príkladov</option>
            </select>
        </div>

        <button class="btn-sidebar btn-success" onclick="resetAndStart()">Nová séria 🔄</button>

        <!-- STATS PANEL -->
        <div class="stats-container">
            <h2>📊 Štatistika</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Úroveň</th>
                            <th>Skóre</th>
                            <th>%</th>
                        </tr>
                    </thead>
                    <tbody id="stats-tbody"></tbody>
                </table>
            </div>
            <button class="btn-sidebar" onclick="downloadStats()">Stiahnuť 💾</button>
            <button class="btn-sidebar btn-danger" onclick="resetStats()">Vymazať 🗑️</button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="app-title">Časovanie slovies</div>

        <!-- VIRTUAL KEYBOARD -->
        <div class="keyboard-container" id="virtual-keyboard">
            <div class="keys-row">
                <button class="key-btn" onclick="insertChar('á')">á</button>
                <button class="key-btn" onclick="insertChar('ä')">ä</button>
                <button class="key-btn" onclick="insertChar('č')">č</button>
                <button class="key-btn" onclick="insertChar('ď')">ď</button>
                <button class="key-btn" onclick="insertChar('é')">é</button>
                <button class="key-btn" onclick="insertChar('í')">í</button>
                <button class="key-btn" onclick="insertChar('ĺ')">ĺ</button>
                <button class="key-btn" onclick="insertChar('ľ')">ľ</button>
                <button class="key-btn" onclick="insertChar('ň')">ň</button>
                <button class="key-btn" onclick="insertChar('ó')">ó</button>
                <button class="key-btn" onclick="insertChar('ô')">ô</button>
                <button class="key-btn" onclick="insertChar('ŕ')">ŕ</button>
                <button class="key-btn" onclick="insertChar('š')">š</button>
                <button class="key-btn" onclick="insertChar('ť')">ť</button>
                <button class="key-btn" onclick="insertChar('ú')">ú</button>
                <button class="key-btn" onclick="insertChar('ý')">ý</button>
                <button class="key-btn" onclick="insertChar('ž')">ž</button>
            </div>
        </div>

        <!-- SINGLE TASK DISPLAY AREA -->
        <div id="task-area" class="task-card"></div>

        <!-- RESULTS OVERVIEW AREA -->
        <div id="results-area" class="results-container" style="display: none;"></div>
    </div>

<script>
// --- VZORY A SLOVESÁ ---
const orderedPatternKeys = ["9", "1", "2", "3", "4", "5", "8", "6", "7"];

const verbPatterns = {
    "9": { name: "KRADNÚŤ (-nú-)", isException: false, verbs: ["chudnúť", "kradnúť", "starnúť", "mladnúť", "žltnúť", "hnednúť"] },
    "1": { name: "POTREBOVAŤ (-ova-)", isException: false, verbs: ["bicyklovať sa", "boxovať", "cestovať", "ďakovať", "existovať", "fungovať", "gratulovať", "gumovať", "havarovať", "korčuľovať sa", "kritizovať", "lyžovať sa", "maľovať", "milovať", "nakupovať", "nastupovať", "obedovať", "odpisovať", "otravovať", "parkovať", "pilotovať", "pracovať", "predstavovať si", "raňajkovať", "reagovať", "recitovať", "relaxovať", "rýľovať", "sánkovať sa", "sľubovať", "šoférovať", "sprchovať sa", "sťažovať sa", "tancovať", "telefonovať", "ukazovať", "upratovať", "vtipkovať", "vyfarbovať", "vystupovať", "vysvetľovať"] },
    "2": { name: "HOVORIŤ (-i-)", isException: false, verbs: ["baliť", "chodiť", "chrániť", "chváliť", "cítiť sa", "cvičiť", "dovoliť", "hanbiť sa", "hlásiť sa", "kaziť", "končiť sa", "kosiť", "kresliť", "kŕmiť", "liečiť", "lúčiť sa", "lúštiť", "meniť sa", "mýliť sa", "narodiť sa", "nosiť", "nudiť sa", "páčiť sa", "robiť", "sadiť", "snežiť", "strážiť", "súhlasiť", "súťažiť", "svietiť", "tešiť sa", "tlačiť", "točiť sa", "topiť sa", "učiť sa", "učiť", "variť", "zdobiť", "zdraviť sa"] },
    "3": { name: "PIŤ (výnimka)", isException: true, verbs: ["žiť", "piť", "počuť", "biť sa", "umyť"] },
    "4": { name: "MUSIEŤ (-ie-)", isException: false, verbs: ["bolieť", "horieť", "letieť", "myslieť", "sedieť", "smrdieť", "vidieť", "visieť"] },
    "5": { name: "ROZUMIEŤ (výnimka)", isException: true, verbs: ["utrieť", "pozrieť sa", "rozprestrieť"] },
    "8": { name: "MAŤ (-a-)", isException: false, verbs: ["behať", "blýskať sa", "búchať", "bývať", "čakať", "červenať sa", "chytať", "čítať", "dávať", "dostávať", "dvíhať", "fúkať", "hádať sa", "hľadať", "hladkať", "hnevať sa", "hojdať sa", "hrať sa", "krájať", "krvácať", "kýchať", "lietať", "mávať", "meškať", "neznášať", "oberať", "obzerať sa", "odchádzať", "odpočívať", "opekať", "odpovedať", "okopávať", "opierať sa", "otvárať", "padať", "pamätať si", "plávať", "počítať", "počúvať", "polievať", "podobať sa", "pomáhať", "ponáhľať sa", "posielať", "poslúchať", "používať", "pozerať", "poznať", "pozývať", "prichádzať", "pýtať sa", "rozmýšľať", "rozprávať", "šepkať", "šmýkať sa", "snívať", "spievať", "spoznávať", "starať sa o", "ťahať", "trhať", "umývať", "usmievať sa", "utekať", "utierať", "volať sa", "vstávať", "vyhrávať", "vysávať", "zabávať sa", "začínať sa", "zametať", "zatvárať", "zbierať", "žmurkať", "obliekať sa", "stávať", "večerať", "stmievať sa", "schováváť sa", "voňať"] },
    "6": { name: "KRIČAŤ (výnimka)", isException: true, verbs: ["držať", "ležať", "pršať", "spať", "kričať", "bežať"] },
    "7": { name: "KLAMAŤ (výnimka)", isException: true, verbs: ["česať sa", "frflať", "hádzať", "hrabať", "hýbať sa", "kašľať", "klamať", "kopať", "kúpať sa", "lízať", "písať", "plakať", "skákať", "škrabať sa", "chápať", "štvať", "rehotať sa"] }
};

const conjugationData = [
    { verb: "rehotať sa", person: "oni", ans: "rehocú sa", exc: true, pattern: "7" },
    { verb: "utrieť", person: "oni", ans: "utrú", exc: true, pattern: "5" },
    { verb: "pozrieť sa", person: "oni", ans: "pozrú sa", exc: true, pattern: "5" },
    { verb: "rozprestrieť", person: "oni", ans: "rozprestrú", exc: true, pattern: "5" },
    { verb: "večerať", person: "on", ans: "večeria", exc: false, pattern: "8" },
    { verb: "stávať", person: "on", ans: "stáva", exc: false, pattern: "8" },
    { verb: "voňať", person: "on", ans: "vonia", exc: false, pattern: "8" },
    { verb: "utekať", person: "my", ans: "utekáme", exc: false, pattern: "8" },
    { verb: "učiť sa", person: "oni", ans: "učia sa", exc: false, pattern: "2" },
    { verb: "letieť", person: "oni", ans: "letia", exc: false, pattern: "4" },
    { verb: "česať sa", person: "ona", ans: "češe sa", exc: true, pattern: "7" },
    { verb: "čítať", person: "ja", ans: "čítam", exc: false, pattern: "8" },
    { verb: "nakupovať", person: "vy", ans: "nakupujete", exc: false, pattern: "1" },
    { verb: "písať", person: "ty", ans: "píšeš", exc: true, pattern: "7" },
    { verb: "spať", person: "on", ans: "spí", exc: true, pattern: "6" }
];

let tasksQueue = [];
let currentTaskIndex = 0;
let userAnswers = [];
let activeInput = null;

document.addEventListener('focusin', (e) => {
    if (e.target.tagName === 'INPUT' && e.target.type === 'text') {
        activeInput = e.target;
    }
});

function insertChar(char) {
    if (!activeInput) return;
    const start = activeInput.selectionStart;
    const end = activeInput.selectionEnd;
    const text = activeInput.value;
    activeInput.value = text.substring(0, start) + char + text.substring(end);
    activeInput.focus();
    activeInput.setSelectionRange(start + 1, start + 1);
}

function resetAndStart() {
    const selectedLevel = document.getElementById('level-select').value;
    const count = parseInt(document.getElementById('count-select').value);
    const useExceptions = document.getElementById('exceptions-toggle').checked;
    const showOptions = document.getElementById('options-toggle').checked;

    tasksQueue = [];
    currentTaskIndex = 0;
    userAnswers = [];

    document.getElementById('results-area').style.display = 'none';
    document.getElementById('task-area').style.display = 'flex';

    for (let i = 0; i < count; i++) {
        tasksQueue.push(generateSingleTask(selectedLevel, useExceptions, showOptions));
    }

    renderCurrentTask();
}

function generateSingleTask(level, useExceptions, showOptions) {
    if (level === "1") {
        // 1. ZAPAMÄTANIE
        let validKeys = orderedPatternKeys.filter(k => useExceptions || !verbPatterns[k].isException);
        let randomKey = validKeys[Math.floor(Math.random() * validKeys.length)];
        let patternObj = verbPatterns[randomKey];
        let randomVerb = patternObj.verbs[Math.floor(Math.random() * patternObj.verbs.length)];

        return {
            level: "1",
            question: `Urči správny časovací vzor pre sloveso: <strong>${randomVerb}</strong>`,
            correctKey: randomKey,
            correctName: verbPatterns[randomKey].name,
            type: showOptions ? "select_pattern" : "text_input",
            verb: randomVerb
        };
    } else if (level === "2") {
        // 2. APLIKÁCIA
        let pool = conjugationData.filter(item => useExceptions || !item.exc);
        let item = pool[Math.floor(Math.random() * pool.length)];

        return {
            level: "2",
            question: `Vyčasuj sloveso <strong>${item.verb}</strong> v osobe: <strong>${item.person}</strong> (prítomný čas)`,
            correct: item.ans,
            type: "text_input",
            verb: item.verb
        };
    } else if (level === "3") {
        // 3. ANALÝZA (Kukučie vajce)
        let validKeys = orderedPatternKeys.filter(k => useExceptions || !verbPatterns[k].isException);
        let targetKey = validKeys[Math.floor(Math.random() * validKeys.length)];
        let otherKeys = validKeys.filter(k => k !== targetKey);
        let oddKey = otherKeys[Math.floor(Math.random() * otherKeys.length)];

        let mainVerbs = [...verbPatterns[targetKey].verbs].sort(() => 0.5 - Math.random()).slice(0, 3);
        let oddVerb = verbPatterns[oddKey].verbs[Math.floor(Math.random() * verbPatterns[oddKey].verbs.length)];

        let options = [...mainVerbs, oddVerb].sort(() => 0.5 - Math.random());

        return {
            level: "3",
            question: `Nájdi "kukučie vajce" (sloveso, ktoré nepatrí medzi ostatné):`,
            wordsList: options.join(", "),
            options: options,
            correct: oddVerb,
            type: showOptions ? "options" : "text_input_words",
            explanation: `Sloveso "${oddVerb}" patrí do vzoru ${verbPatterns[oddKey].name}.`
        };
    } else {
        // 4. HODNOTENIE (Oprava chýb)
        let pool = conjugationData.filter(item => useExceptions || !item.exc);
        let item = pool[Math.floor(Math.random() * pool.length)];
        let isCorrect = Math.random() > 0.5;

        let displayForm = isCorrect ? item.ans : item.ans + "te";
        if (!isCorrect && displayForm === item.ans) displayForm = item.ans + "m";

        return {
            level: "4",
            question: `Je tvar <strong>"${displayForm}"</strong> pre sloveso <strong>${item.verb}</strong> (${item.person}) správny?`,
            type: showOptions ? "boolean_correct" : "text_input_eval",
            isCorrectBool: isCorrect,
            correctForm: item.ans,
            displayForm: displayForm
        };
    }
}

function renderCurrentTask() {
    const task = tasksQueue[currentTaskIndex];
    const area = document.getElementById('task-area');
    const total = tasksQueue.length;

    let keyboard = document.getElementById('virtual-keyboard');
    keyboard.style.display = (task.type.startsWith("text_input")) ? "block" : "none";

    let html = `
        <div class="task-header">
            <span>Úloha ${currentTaskIndex + 1} z ${total}</span>
            <span>Úroveň ${task.level}</span>
        </div>
        <div class="task-question">${task.question}</div>
    `;

    if (task.wordsList) {
        html += `<div class="words-display-box">${task.wordsList}</div>`;
    }

    if (task.type === "select_pattern") {
        let useExceptions = document.getElementById('exceptions-toggle').checked;
        html += `<select id="current-answer" class="input-field"><option value="">-- Vyber vzor --</option>`;
        orderedPatternKeys.forEach(k => {
            if (!useExceptions && verbPatterns[k].isException) return;
            html += `<option value="${k}">Vzor ${verbPatterns[k].name}</option>`;
        });
        html += `</select>`;
    } else if (task.type === "text_input" || task.type === "text_input_words" || task.type === "text_input_eval") {
        let placeholder = "Tvoja odpoveď...";
        if (task.type === "text_input_eval") placeholder = "Napíš 'správne' alebo oprav tvar...";
        html += `<input type="text" id="current-answer" class="input-field" placeholder="${placeholder}" autocomplete="off">`;
    } else if (task.type === "options") {
        html += `<div class="options-grid">`;
        task.options.forEach(opt => {
            html += `<button class="option-btn" onclick="selectOption(this, '${opt}')">${opt}</button>`;
        });
        html += `</div><input type="hidden" id="current-answer">`;
    } else if (task.type === "boolean_correct") {
        html += `
            <div class="options-grid">
                <button class="option-btn" onclick="selectOption(this, 'true')">Áno, je správny</button>
                <button class="option-btn" onclick="selectOption(this, 'false')">Nie, je nesprávny</button>
            </div>
            <input type="hidden" id="current-answer">
        `;
    }

    let isLast = currentTaskIndex === total - 1;
    html += `
        <div class="nav-controls">
            <div></div>
            <button class="btn-sidebar btn-success" onclick="nextTask()">${isLast ? "Dokončiť a skontrolovať ✨" : "Ďalšia úloha ➔"}</button>
        </div>
    `;

    area.innerHTML = html;
}

function selectOption(btn, val) {
    let parent = btn.parentElement;
    Array.from(parent.children).forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    document.getElementById('current-answer').value = val;
}

function nextTask() {
    const inputElem = document.getElementById('current-answer');
    const val = inputElem ? inputElem.value.trim() : "";

    userAnswers.push(val);

    if (currentTaskIndex < tasksQueue.length - 1) {
        currentTaskIndex++;
        renderCurrentTask();
    } else {
        finishSeries();
    }
}

function finishSeries() {
    document.getElementById('task-area').style.display = 'none';
    document.getElementById('virtual-keyboard').style.display = 'none';

    const resultsArea = document.getElementById('results-area');
    resultsArea.style.display = 'block';

    let correctCount = 0;
    let html = `<h2>Výsledky série</h2>`;

    tasksQueue.forEach((task, i) => {
        let userVal = userAnswers[i];
        let isCorrect = false;
        let userDisplayVal = userVal || '(prázdne)';
        let expectedText = "";

        if (task.type === "select_pattern") {
            isCorrect = (userVal === task.correctKey);
            userDisplayVal = verbPatterns[userVal] ? `Vzor ${verbPatterns[userVal].name}` : userVal;
            expectedText = `Vzor ${task.correctName}`;
        } else if (task.type === "text_input" || task.type === "text_input_words") {
            if (task.level === "1") {
                // Szöveges megadásnál az 1. szinten
                isCorrect = task.correctName.toLowerCase().includes(userVal.toLowerCase()) && userVal.length > 2;
                expectedText = `Vzor ${task.correctName}`;
            } else {
                isCorrect = (userVal.toLowerCase() === task.correct.toLowerCase());
                expectedText = task.correct;
            }
        } else if (task.type === "options") {
            isCorrect = (userVal === task.correct);
            expectedText = task.correct;
        } else if (task.type === "boolean_correct") {
            let userBool = (userVal === 'true');
            isCorrect = (userBool === task.isCorrectBool);
            userDisplayVal = userBool ? "Správny" : "Nesprávny";
            expectedText = task.isCorrectBool ? "Správny" : `Nesprávny (Správny tvar: ${task.correctForm})`;
        } else if (task.type === "text_input_eval") {
            if (task.isCorrectBool) {
                isCorrect = (userVal.toLowerCase() === "správne" || userVal.toLowerCase() === task.correctForm.toLowerCase());
                expectedText = "Správne";
            } else {
                isCorrect = (userVal.toLowerCase() === task.correctForm.toLowerCase());
                expectedText = task.correctForm;
            }
        }

        if (isCorrect) correctCount++;

        html += `
            <div class="result-item ${isCorrect ? 'result-correct' : 'result-incorrect'}">
                <div><strong>${i + 1}. ${task.question}</strong></div>
                ${task.wordsList ? `<div>Kolekcia slov: <em>${task.wordsList}</em></div>` : ''}
                <div>Tvoja odpoveď: <em>${userDisplayVal}</em></div>
                <div>${isCorrect ? '✓ Správne' : '✗ Správna odpoveď: ' + expectedText}</div>
            </div>
        `;
    });

    resultsArea.innerHTML = html;
    addStatRecord(document.getElementById('level-select').value, correctCount, tasksQueue.length);
}

// --- STATISZTIKA ---
function addStatRecord(level, correct, total) {
    let history = JSON.parse(localStorage.getItem('verb_history_v3') || '[]');
    const percent = Math.round((correct / total) * 100);
    
    history.push({
        level: level,
        score: `${correct}/${total}`,
        percent: `${percent}%`
    });

    localStorage.setItem('verb_history_v3', JSON.stringify(history));
    renderStatsTable();
}

function renderStatsTable() {
    let history = JSON.parse(localStorage.getItem('verb_history_v3') || '[]');
    const tbody = document.getElementById('stats-tbody');
    tbody.innerHTML = '';

    history.forEach((row, index) => {
        tbody.innerHTML += `
            <tr>
                <td>${index + 1}</td>
                <td>Úroveň ${row.level}</td>
                <td>${row.score}</td>
                <td><strong>${row.percent}</strong></td>
            </tr>
        `;
    });

    const wrapper = document.querySelector('.table-wrapper');
    if (wrapper) wrapper.scrollTop = wrapper.scrollHeight;
}

function resetStats() {
    if (confirm("Naozaj chceš vymazať celú históriu štatistík?")) {
        localStorage.removeItem('verb_history_v3');
        renderStatsTable();
    }
}

function downloadStats() {
    let history = JSON.parse(localStorage.getItem('verb_history_v3') || '[]');
    if (history.length === 0) {
        alert("Zatiaľ neexistujú žiadne záznamy.");
        return;
    }

    let content = `HISTÓRIA POKUSOV - ČASOVANIE SLOVIES\n` +
                  `====================================\n\n` +
                  `Pokus | Úroveň | Skóre | Úspešnosť\n` +
                  `------------------------------------\n`;

    history.forEach((row, index) => {
        content += `${index + 1}.     | Úroveň ${row.level} | ${row.score}  | ${row.percent}\n`;
    });

    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'statistika_casovanie.txt';
    a.click();
}

window.onload = () => {
    resetAndStart();
    renderStatsTable();
};
</script>

</html>
